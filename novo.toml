[package]
name        = "fuzzy-nv"
version     = "0.0.2"
description = "fzf's and nucleo's subsequence matching: a needle compiled ONCE into a pattern with fzf's extended search syntax, matched against a hundred thousand candidates without recompiling it; the bonus table (word boundary, camel case, path separator, consecutive run) as a value a caller can replace; a score without positions for ranking and positions on demand for highlighting, always on grapheme-cluster boundaries; a stable ranking with fzf's tiebreaks; and the classic string distances in a module of their own.  Interface only — every body is a todo()."
license     = "Apache-2.0"

# An INTERFACE release: every `pub fn` body is a `todo()`, so the
# signatures and the effect rows are published and nothing is
# implemented.  `novo pkg publish` recognises the shape and requires
# both the draft stability and the 0.0.x version; the first
# implementation is the 0.1.0 published over it.
stability   = "draft"

# `core`.  A match is arithmetic over two strings the caller already
# holds; nothing is read, nothing is written, and the answer is a
# score and a range rather than a copy of anything.
layer       = "core"

category    = "text"

tags        = ["fuzzy", "fzf", "nucleo", "matching", "completion", "levenshtein", "jaro-winkler", "rapidfuzz", "sans-io"]
repository  = "https://github.com/novolang/fuzzy-nv"
maintainers = ["novo-lang"]
# 0.13.0 is the first toolchain with lists as reference types and `var`
# parameters, which `positions_into` and `rank_into` write through.
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A needle compiled once, a score without positions, and positions that never split a cluster"

[dependencies]
# unicode-nv, for two things.
#
# The bonus table classifies characters.  Almost all of a score is the
# bonus for where a match lands: after a separator, at a camel-case
# boundary, at the start of a word.  Deciding that in ASCII gets German,
# Greek and Cyrillic identifiers wrong.  `uclass.is_uppercase`,
# `is_lowercase` and `is_alphanumeric` take a codepoint and no data
# table.
#
# A position is always on a cluster boundary.  The matcher advances by
# `ugrapheme.next_boundary`, so every offset it answers is a boundary
# and a highlight never paints half a character.
unicode-nv = "^0.1.3"
