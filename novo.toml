[package]
name        = "fuzzy-nv"
version     = "0.1.0"
description = "fzf's subsequence matching: a needle compiled once into a pattern with fzf's extended search syntax and smart case; fzf's bonus table as a value a caller can replace; a fast scorer and an exact one; a score without positions for ranking and positions on demand for highlighting, always on grapheme-cluster boundaries; a total ranking with fzf's tiebreaks; and the classic string distances, each with a bounded form."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`.  A match is arithmetic over two strings the caller already
# holds.  Nothing is read or written, and the answer is a score and a
# range rather than a copy of anything.
layer       = "core"

category    = "text"

tags        = ["fuzzy", "fzf", "nucleo", "matching", "completion", "levenshtein", "jaro-winkler", "rapidfuzz", "sans-io"]
repository  = "https://github.com/novolang/fuzzy-nv"
maintainers = ["novo-lang"]
# 0.13.0 is the first toolchain with lists as reference types and `var`
# parameters, which `positions_into` and `rank_into` write through.
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A needle compiled once, a score without positions, and positions that never split a cluster"

[dependencies]
# unicode-nv, for two things.
#
# The bonus table classifies characters.  Almost all of a score is the
# bonus for where a match lands: after a separator, at a camel-case
# boundary, at the start of a word.  Deciding that in ASCII gets German,
# Greek and Cyrillic identifiers wrong.  `uclass.is_uppercase`,
# `is_lowercase` and `is_alphanumeric` take a codepoint and no data
# table.
#
# A position is always on a cluster boundary.  The matcher advances by
# `ugrapheme.next_boundary`, so every offset it answers is a boundary
# and a highlight never paints half a character.
unicode-nv = "^0.1.3"
